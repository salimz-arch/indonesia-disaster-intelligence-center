# ═══ Konfigurasi tooling IDIC backend ═══
# Dependency tetap di requirements.txt — file ini hanya config.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F/W = pycodestyle+pyflakes, I = import sorting, UP = pyupgrade,
# B = bugbear, ASYNC = async correctness, S = security, RUF = ruff khusus
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert diperbolehkan di tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"