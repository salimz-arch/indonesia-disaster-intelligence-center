# ═══ Konfigurasi tooling IDIC backend ═══
# Dependency tetap di requirements.txt — file ini hanya config.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"alembic/*" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: Depends() di default argument adalah pattern resmi
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]