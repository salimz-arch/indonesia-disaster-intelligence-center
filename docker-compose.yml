# ═══ IDIC — infrastruktur development lokal ═══
# Hanya database & cache. Backend/frontend di-container-kan pada Step 17.

services:
  postgres:
    image: postgres:16-alpine
    container_name: idic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idic}
      POSTGRES_DB: ${POSTGRES_DB:-idic}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idic} -d ${POSTGRES_DB:-idic}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: idic-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: